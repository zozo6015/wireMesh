[package]
name = "relay"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
rustls = "0.23"
# Not in the Task 13 brief's dep list; added because mkcerts/relay/lib all
# exchange certs as PEM files on disk (across process boundaries) and rustls
# 0.23 no longer ships its own PEM parser — rustls-pemfile is the standard
# complement for turning `ca.pem`/`relay.pem`/`gw-*.pem` back into the
# `CertificateDer`/`PrivateKeyDer` types rustls::ServerConfig/ClientConfig want.
rustls-pemfile = "2"
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
natlab = { path = "../natlab" }

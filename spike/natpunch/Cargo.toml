[package]
name = "natpunch"
version = "0.1.0"
edition = "2021"

# Cycle 4b LINCHPIN de-risk (spec 2026-07-20-cycle4b-nat-traversal-design.md §3):
# prove a REAL boringtun WireGuard handshake + traffic over a DIRECT tunnel after
# a controller-brokered simultaneous hole punch, using a transient SO_REUSEPORT
# punch socket on the WG listen port (punch to open the NAT mapping, then close
# the punch socket so boringtun's own socket reuses that same mapping).
# Standalone crate (CLAUDE.md: spike/* crates are not in the root workspace).

[dependencies]
anyhow = "1"
libc = "0.2"
boringtun = { version = "0.6", features = ["device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
natlab = { path = "../natlab" }

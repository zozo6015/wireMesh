[package]
name = "natpunch2"
version = "0.1.0"
edition = "2021"

# Puncher-socket-isolation de-risk (spec 2026-07-28-puncher-socket-isolation-design.md,
# "De-risk spike"): prove that a punch driven ENTIRELY by boringtun's own
# endpoint-set handshake — with NO separate SO_REUSEPORT punch socket anywhere —
# reliably opens a port-restricted NAT mapping and completes a DIRECT WireGuard
# handshake between two gateways. This gates productionizing approach B (delete
# the gateway's SO_REUSEPORT puncher; let boringtun's own handshake init be the
# punch). Contrast spike/natpunch, which used a transient SO_REUSEPORT punch
# socket to pre-open the mapping.
#
# Standalone crate (CLAUDE.md: spike/* crates are not in the root workspace).

[dependencies]
anyhow = "1"
libc = "0.2"
boringtun = { version = "0.6", features = ["device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
natlab = { path = "../natlab" }

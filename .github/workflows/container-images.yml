name: Container images

# Build the WireMesh binaries + per-component container images and push them to
# ghcr.io/<owner>/wiremesh-{controller,gateway,relay,fabricctl}. The expensive
# release build (whole workspace, incl. the embedded eBPF program) happens once
# in the `builder` job whose BuildKit layer cache the four image jobs reuse.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: &build_paths
      - 'crates/**'
      - 'proto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/docker/**'
      - '.dockerignore'
      - '.github/workflows/container-images.yml'
  # PRs build every image to validate the Dockerfile/build, but do NOT push
  # (see the `push:` guard below) — only main/tags publish to ghcr.io.
  pull_request:
    branches: [main]
    paths: *build_paths
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  # Warm the shared `builder` stage cache once (the whole release + eBPF build).
  builder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build & cache the builder stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: builder
          push: false
          cache-from: type=gha,scope=builder
          cache-to: type=gha,mode=max,scope=builder

  # Assemble + push each runtime image, reusing the cached builder stage so only
  # the small per-component runtime layer is rebuilt.
  images:
    needs: builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: controller, image: wiremesh-controller }
          - { component: gateway,    image: wiremesh-gateway }
          - { component: relay,      image: wiremesh-relay }
          - { component: fabricctl,  image: wiremesh-fabricctl }
          - { component: operator,   image: wiremesh-operator }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=builder
            type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

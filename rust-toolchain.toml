# The toolchain this workspace is built and linted with.
#
# Before this file existed the toolchain was implicit in three unrelated places:
# `dev/Dockerfile`'s `FROM rust:1-bookworm`, `deploy/docker/Dockerfile`'s
# digest-pinned builder, and whatever `rustup` default a contributor's host
# happened to carry. A first-ever `cargo fmt --check` / `cargo clippy -D warnings`
# gate (B4) turns that drift into red CI, because rustfmt's and clippy's output
# is toolchain-dependent — so the toolchain is stated once, here, where rustup
# honours it for every `cargo` invocation in the repo.
#
# EXACT PATCH, not `stable`, and this was measured rather than assumed:
# `channel = "stable"` makes rustup sync to 1.98.0 and print
# `info: syncing channel updates` + `downloading N components` on EVERY
# `docker run --rm`, because this image's rustup home is ephemeral — and it
# moves every done-bar run onto a compiler the suite has never run on.
# `1.97.1` is the toolchain `dev/Dockerfile` installs and
# `deploy/docker/Dockerfile`'s digest-pinned builder resolves to, so it
# resolves instantly with no download and dev == release. This is the same
# "capture the known-good version from a green run" discipline the bpf-linker
# 0.10.4 pin follows, applied to the compiler.
#
# This file does NOT reach the eBPF build. `crates/wiremesh-enforcer`'s build
# script calls `aya_build::build_ebpf(.., Toolchain::default())`, which shells
# out as `rustup run nightly cargo build`; `rustup run` sets `RUSTUP_TOOLCHAIN`,
# which outranks any toolchain file. And a STANDALONE `cargo build` inside
# `crates/wiremesh-enforcer-ebpf` — the way CLAUDE.md says to build it — would
# otherwise be captured by this pin, so that directory carries its own
# `rust-toolchain.toml` naming nightly. Both paths are covered.
#
# `rust-src` is deliberately absent: it is a nightly component, and
# `dev/Dockerfile` installs it with the nightly toolchain.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]

[package]
name = "wiremesh-gateway"
version = "0.1.0"
edition = "2021"

[lib]
name = "wiremesh_gateway"
path = "src/lib.rs"

[[bin]]
name = "wiremesh-gateway"
path = "src/main.rs"

[dependencies]
wiremesh-proto = { path = "../wiremesh-proto" }
wiremesh-policy = { path = "../wiremesh-policy" }
wiremesh-enforcer = { path = "../wiremesh-enforcer" }
wiremesh-trust = { path = "../wiremesh-trust" }
wiremesh-relay = { path = "../wiremesh-relay" }
wiremesh-enroll = { path = "../wiremesh-enroll" }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
boringtun = { version = "0.6", features = ["device"] }
libc = "0.2"
# StreamExt::next() over tonic::Streaming<SyncMessage> in src/sync.rs — a
# library-code dependency (not just tests), so it must live here rather than
# [dev-dependencies].
tokio-stream = "0.1"
# Relay-death classification (aether-prod-fi-01 wedge fix, follow-up round):
# `src/relay.rs` downcasts pump errors to `quinn::ConnectionError`/
# `quinn::SendDatagramError` and classifies `Client::close_reason()` into
# `RelayDeathReason` — library code, so quinn is a REGULAR dependency now
# (it was dev-only for `relay_matrix.rs`'s killable relay, whose comment
# anticipated this promotion). Version matches `wiremesh-relay`'s own
# (plain, unpinned-feature) `quinn = "0.11"` so Cargo unifies to one
# resolved version workspace-wide.
quinn = "0.11"

[dev-dependencies]
wiremesh-testkit = { path = "../wiremesh-testkit", features = ["netns"] }
tempfile = "3"

[features]
netns-tests = []

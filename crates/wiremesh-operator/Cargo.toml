[package]
name = "wiremesh-operator"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
# Kubernetes client + controller runtime + CRD derive. Pin TLS to rustls so it
# unifies with the workspace's ring-backed rustls (see root Cargo.toml's rustls
# note) rather than pulling aws-lc-rs.
# No "ws" feature: the operator execs via the bundled kubectl (kube-rs 0.95's
# WebSocket exec fails SA auth against real API servers — see admin_exec.rs).
kube = { version = "0.95", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
schemars = "0.8"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tonic = { workspace = true }
prost = { workspace = true }
# UDS gRPC client (operator-admin subcommand → controller's implicit-admin
# socket): the same custom-connector pattern wiremesh-testkit uses.
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
wiremesh-proto = { path = "../wiremesh-proto" }

[dev-dependencies]
# `tests/rebind_redemption_e2e.rs` drives the operator's own `FabricAdmin`
# rebind mint against a REAL controller and redeems the token with a
# replacement gateway — the only way to catch a wrong token `kind`, which no
# shape assertion or controller-side test can see (the controller's own
# `tests/rebind.rs` hand-writes the request). Default features: the userspace
# `TestController`/`StubGateway` surface only, never the privileged `netns`
# harness. Dev-only, and no dependency cycle — `wiremesh-testkit` depends on
# `wiremesh-controller`, which does not depend on this crate.
wiremesh-testkit = { path = "../wiremesh-testkit" }

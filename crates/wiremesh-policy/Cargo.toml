[package]
name = "wiremesh-policy"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[dependencies]
# `PolicyIR::from_json` (ir.rs, Task 2) returns `anyhow::Result`.
anyhow = { workspace = true }
# `PolicyDoc`/`BlockSrc`/`RuleSrc`/`RuleBody` (dsl.rs, Task 1 Step 3) derive
# `Deserialize` off this.
serde = { workspace = true }
# The DSL's on-disk format (design §4) is YAML, not JSON — same crate
# `wiremesh-controller` already uses for `fabric.yaml`/policy stanzas.
serde_yaml = { workspace = true }
# `SegmentDef::cidrs` and every CIDR the validator parses out of `src`/`dst`
# are `ipnet::Ipv4Net` (v1 is IPv4-only per design §4).
ipnet = { workspace = true }
# `PolicyIR`'s canonical wire form (ir.rs, Task 2, design D-C3-1) is JSON,
# not YAML — `to_canonical_json`/`from_json`/`blocks_fingerprint` all
# serialize/deserialize through this.
serde_json = { workspace = true }
# `rule_id` (design D-C3-3) and `blocks_fingerprint` (design D-C3-8) are
# both sha256 content hashes — same crate/version `wiremesh-controller`
# already uses for its own hashing.
sha2 = { workspace = true }

[dev-dependencies]
# `tests/props.rs` (Task 3): property tests over generated policies.
proptest = "1"

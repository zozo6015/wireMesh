[package]
name = "wiremesh-testkit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
wiremesh-proto = { path = "../wiremesh-proto" }
wiremesh-controller = { path = "../wiremesh-controller" }
tempfile = "3"
# (Task 13) `mint_api_token`'s random name suffix (so repeated calls in one
# test never collide on `api_token.name`'s UNIQUE constraint) — same crate
# version `wiremesh-controller` already uses for the analogous job.
rand = "0.8"
# Connect a tonic `Channel` to the controller's Unix socket: `tower::service_fn`
# supplies the custom connector, `hyper-util`'s `TokioIo` adapts a
# `tokio::net::UnixStream` to the `hyper::rt::{Read,Write}` traits tonic's
# hyper-1.x-based transport expects (a plain `UnixStream` no longer
# implements the connector's required traits directly, unlike older tonic).
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# `gen_csr` (implementer's helper for Enrollment tests): builds a gateway-side
# CSR the same way a real gateway would, mirroring Phase 0's
# spike/relay/src/bin/mkcerts.rs. Default features (crypto+pem+ring) are
# enough — building/serializing a CSR doesn't need the `x509-parser` feature
# (that's only for *parsing* one back, done in wiremesh-trust).
rcgen = { workspace = true }
# `StubGateway::cert_serial` parses the serial number back out of its issued
# leaf cert's PEM. Already present transitively (rcgen's own `x509-parser`
# feature, used by wiremesh-trust, pulls in this exact version per
# Cargo.lock) — declaring it directly here just makes the dependency
# explicit rather than relying on an incidental transitive edge.
x509-parser = "0.16"
# (Task 12) `netns::join_netns`'s `setns(2)` call — optional, only pulled in
# by the `netns` feature below, so pure-userspace consumers (e.g.
# wiremesh-controller's own test suite) never link it.
libc = { version = "0.2", optional = true }
# (Task 13) `src/conformance.rs`'s `run_scenario`: compiles each scenario's
# `policy_yaml` with the SAME compiler the controller uses, and drives it
# through `probe_with`/`Enforcer::{apply,counters,flush_flows}`. Both
# optional, gated by the `netns` feature below alongside `libc` — a plain
# (non-netns) consumer of this crate's userspace `TestController`/
# `StubGateway` surface has no use for either and shouldn't link them.
wiremesh-policy = { path = "../wiremesh-policy", optional = true }
wiremesh-enforcer = { path = "../wiremesh-enforcer", optional = true }

[features]
# Gates `src/netns.rs`: the privileged Linux network-namespace test harness
# (`Lab`/`Ns`/`wg_lab`/`join_netns`), graduated from `spike/natlab` and the
# enforcer test files' duplicated `wg_lab`/`join_netns` copies (Task 12).
# Off by default so depending on `wiremesh-testkit` for its userspace
# `TestController`/`StubGateway` surface never compiles or links `libc`'s
# netns bits, and never requires a Linux host.
#
# (Task 13) Also gates `src/conformance.rs`, which is built on top of
# `netns.rs`'s `Lab`/`Ns`/`wg_lab` and additionally needs `wiremesh-policy`/
# `wiremesh-enforcer` — hence `dep:wiremesh-policy`/`dep:wiremesh-enforcer`
# alongside `dep:libc` here rather than a separate feature. NOTE:
# `wiremesh-enforcer`'s own dev-dependency on THIS crate (for its own
# `tests/*.rs`, with `default-features = false, features = ["netns"]`) is a
# Cargo dev-dependency cycle, not a real one — Cargo permits a crate's
# dev-dependencies to depend back on that same crate because dev-deps are
# only linked when building this crate's own tests/benches/examples, never
# when another crate depends on it as an ordinary library — so
# `wiremesh-testkit` depending on `wiremesh-enforcer` as a normal
# (non-dev) dependency here does not create a real cycle in the workspace's
# build graph.
netns = ["dep:libc", "dep:wiremesh-policy", "dep:wiremesh-enforcer"]

[dev-dependencies]
# (Task 14) `tests/end_to_end_policy.rs` drives a raw `tonic::Streaming<SyncMessage>`
# (`StubGateway::open_sync`'s return type) directly, the same way
# `wiremesh-controller`'s own `tests/{policy_pipeline,sync_snapshot,sync_delta}.rs`
# do — `StreamExt::next()` needs this crate in scope. Test-only: this
# crate's own `src/` never streams a `Sync.Watch` response itself.
tokio-stream = "0.1"

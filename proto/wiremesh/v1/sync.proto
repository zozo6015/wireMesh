syntax = "proto3";
package wiremesh.v1;

service Sync {
  rpc Watch(WatchRequest) returns (stream SyncMessage);
  rpc Report(ReportRequest) returns (ReportResponse);
}
message WatchRequest {}
message SyncMessage { oneof body { StateSnapshot snapshot = 1; Delta delta = 2; PunchDirective punch = 3; } }
// Broker-issued NAT-traversal instruction: sent to one gateway of a pair,
// carrying the *other* gateway's candidate set, so both sides can fire a
// punch at (approximately) the same instant. Does not use the
// subject_gateway_id() self-skip routing path — the broker addresses each
// pair member's Watch stream explicitly (see cycle4b design doc §4).
message PunchDirective {
  uint64 peer_gateway_id = 1;      // the peer to punch toward
  repeated string candidates = 2;  // that peer's candidate set (public + local)
  uint64 go_unix_ms = 3;           // synchronized fire instant (best-effort corroboration
                                    // of the broker's back-to-back sends, which are the
                                    // primary go-skew guarantee)
}
message PeerKey { uint32 epoch = 1; string pubkey = 2; string state = 3; } // pending|active|retiring
message Peer {
  uint64 gateway_id = 1;
  string segment_name = 2;
  repeated PeerKey keys = 3;
  repeated string candidate_endpoints = 4;
  repeated string allowed_ips = 5;      // peer segment CIDRs
}
message RelayInfo { uint64 relay_id = 1; string endpoint = 2; }
message RelayHealth { uint64 relay_id = 1; bool healthy = 2; }
message StateSnapshot {
  uint64 revision = 1;
  string self_cert_pem = 2;
  repeated Peer peers = 3;
  repeated RelayInfo relays = 4;
  bytes policy_ir = 5;                    // empty IR v0 in cycle 2
  uint64 policy_version = 6;
  repeated string revoked_serials = 7;
}
message Delta { uint64 revision = 1; repeated Peer upserted_peers = 2; repeated uint64 removed_peer_ids = 3; repeated RelayInfo relays = 4; bytes policy_ir = 5; uint64 policy_version = 6; repeated string revoked_serials = 7; }
message ReportRequest {
  uint64 applied_version = 1;
  repeated string local_endpoints = 2;  // gateway's own routable local ip:wg_port
                                         // addresses, offered to the controller as
                                         // local-source candidates for LAN/hairpin
                                         // reachability. Additive field; empty = old
                                         // (pre-4b) client behavior.
  repeated RelayHealth relay_health = 3; // additive; gateway per-relay health
                                          // reports (4c).
}
message ReportResponse {}

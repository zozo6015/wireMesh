syntax = "proto3";
package wiremesh.v1;

service Sync {
  rpc Watch(WatchRequest) returns (stream SyncMessage);
  rpc Report(ReportRequest) returns (ReportResponse);
  rpc SubmitEpochKey(SubmitEpochKeyRequest) returns (SubmitEpochKeyResponse);
}
// Note: `WatchRequest` carries NO identity — identity is derived exclusively
// from the mTLS peer certificate's subject CN (see `services::sync`). The one
// field below is a per-PROCESS liveness nonce, not a credential.
message WatchRequest {
  // (Sync session generation) The reporting process's per-BOOT nonce, chosen
  // once per gateway process (NOT per connection — the rotation tick's unary
  // `Report` uses its own short-lived channel and would otherwise carry a
  // value that never matched the last Watch). Opening a Watch RECORDS this
  // value against the authenticated gateway id; a subsequent `Report` whose
  // `session_generation` conflicts with the recorded one is a delayed
  // pre-restart report and is rejected wholesale (`FAILED_PRECONDITION`).
  //
  // MUST be NONZERO for clients that implement the scheme: 0 is the
  // legacy/unknown sentinel, and the controller treats a 0 on either side as
  // "no opinion" and accepts (see the reject predicate in `services::sync`).
  // Relays also open `Sync.Watch` but never `Report`, so they are outside the
  // scheme entirely and send 0; `watch_relay` ignores the field.
  uint64 session_generation = 1;
}
message SyncMessage { oneof body { StateSnapshot snapshot = 1; Delta delta = 2; PunchDirective punch = 3; RotateDirective rotate = 4; } }
// Broker-issued NAT-traversal instruction: sent to one gateway of a pair,
// carrying the *other* gateway's candidate set, so both sides can fire a
// punch at (approximately) the same instant. Does not use the
// subject_gateway_id() self-skip routing path — the broker addresses each
// pair member's Watch stream explicitly (see cycle4b design doc §4).
message PunchDirective {
  uint64 peer_gateway_id = 1;      // the peer to punch toward
  repeated string candidates = 2;  // that peer's candidate set (public + local)
  uint64 go_unix_ms = 3;           // synchronized fire instant (best-effort corroboration
                                    // of the broker's back-to-back sends, which are the
                                    // primary go-skew guarantee)
  // FIELD 4 IS DELIBERATELY FREE. The session-generation design originally
  // proposed `peer_session_generation = 4` here, and it was CUT: its only
  // intended consumer was the `Relayed -> Direct` cutover's backoff reset,
  // and the cutover is a separate (gateway-local) item. The restart
  // asymmetry it was meant to signal is already handled controller-side by
  // `Broker::on_gateway_connected`'s `clear_reported_states` plus
  // `pair_settled`'s both-directions requirement — the session generation is
  // precisely what makes that clear STICK. A later item may claim field 4 if
  // it can name a real consumer; do not add it speculatively.
}
// Controller->gateway, sent to the addressed gateway's own Watch stream
// (like PunchDirective, explicit addressing — not the subject_gateway_id()
// self-skip routing path): tells the gateway to mint the given new epoch's
// key and begin make-before-break rotation.
message RotateDirective {
  uint32 epoch = 1;
}
// Gateway->controller: submits the real WG public key it generated for
// `epoch` (the private key never leaves the gateway).
message SubmitEpochKeyRequest {
  uint32 epoch = 1;
  string pubkey = 2;
  // (Sync session generation) The submitting gateway's per-PROCESS nonce —
  // the same value it sends on `WatchRequest`/`ReportRequest`, from the same
  // `OnceLock`. The controller rejects a submission whose generation
  // conflicts with the one recorded at this gateway's last Watch open.
  //
  // This is NOT belt-and-braces. `Db::set_epoch_pubkey` is a
  // compare-and-swap that only ever overwrites the `awaiting-submission`
  // sentinel, so a stale submission cannot clobber a real key — but it CAN
  // WIN that swap. When a submission is in flight across a gateway restart,
  // the controller re-issues a `RotateDirective` for the still-sentinel
  // epoch, the new process mints a DIFFERENT key and submits it for the same
  // epoch, and whichever lands first wins. If the pre-restart key wins, the
  // controller advertises a pubkey the restarted gateway is not serving on
  // that epoch's tun, no peer can ever ack it, and the rotation promotes it
  // anyway on the grace timeout (see `rotation::decide` rule 4 and
  // `docs/research/key-rotation-teardown-notes.md` §E). The generation makes
  // the fresh submission the one that wins.
  //
  // 0 = legacy/unknown, accepted (a 0 on EITHER side accepts — see the
  // shared predicate in `services::sync`). Relays never submit epoch keys
  // and are outside the scheme entirely.
  uint64 session_generation = 3;
}
message SubmitEpochKeyResponse {}
message PeerKey { uint32 epoch = 1; string pubkey = 2; string state = 3; } // pending|active|retiring
message Peer {
  uint64 gateway_id = 1;
  string segment_name = 2;
  repeated PeerKey keys = 3;
  repeated string candidate_endpoints = 4;
  repeated string allowed_ips = 5;      // peer segment CIDRs
}
message RelayInfo { uint64 relay_id = 1; string endpoint = 2; }
message RelayHealth { uint64 relay_id = 1; bool healthy = 2; }
message StateSnapshot {
  uint64 revision = 1;
  string self_cert_pem = 2;
  repeated Peer peers = 3;
  // (4c review fix) Field 4 was briefly `repeated RelayInfo` on this branch
  // before landing on main — changing an EXISTING field's wire type is a
  // hazard (both for the wire and for a persisted `state.json`), so it is
  // kept as its original `repeated string` type here, deprecated and
  // unused; the structured relay data lives in `relay_infos` (field 8,
  // below) instead. Never populated by this controller.
  repeated string deprecated_relays = 4 [deprecated = true];
  bytes policy_ir = 5;                    // empty IR v0 in cycle 2
  uint64 policy_version = 6;
  repeated string revoked_serials = 7;
  repeated RelayInfo relay_infos = 8;
}
message Delta {
  uint64 revision = 1;
  repeated Peer upserted_peers = 2;
  repeated uint64 removed_peer_ids = 3;
  // See `StateSnapshot.deprecated_relays`'s doc comment — same rationale.
  repeated string deprecated_relays = 4 [deprecated = true];
  bytes policy_ir = 5;
  uint64 policy_version = 6;
  repeated string revoked_serials = 7;
  repeated RelayInfo relay_infos = 8;
  // true iff this delta updates the relay set (relay_infos is authoritative,
  // possibly empty); false = sparse delta, relays unchanged.
  bool relays_updated = 9;
}
// DESIGN FINDING (recorded, NOT fixed here — see the field-by-field
// justification in `wiremesh-gateway`'s `send_epoch_ack`):
//
// `ReportRequest` conflates TWO different messages behind one RPC — a
// periodic FULL-STATE SNAPSHOT (the sync loop's steady-state report) and a
// SPARSE EVENT (the rotation tick's unary epoch ack, which dials its own
// short-lived channel). Its fields carry three incompatible update
// semantics, and the controller applies most of them unconditionally:
//
//   full REPLACE, empty == CLEAR : local_endpoints, peer_paths (when
//                                  peer_paths_snapshot == true)
//   last-writer-wins scalar      : applied_version
//   sparse, empty == no-op       : relay_health, epoch_acks
//
// The consequence is that a sender wanting to deliver ONE field must
// nonetheless reconstruct every replace/LWW field, or it destroys
// controller-side state by omission. That has already produced two live
// bugs at a single call site: `applied_version: 0` zeroing the roster
// version on every rotation ack, and `local_endpoints: []` wiping the
// gateway's LAN/hairpin punch candidates (and publishing the shrunk set to
// peers) mid-rotation.
//
// Note the defenses are ad-hoc and were added one at a time, which is why
// coverage is uneven: `peer_paths` got an EXPLICIT opt-out (the
// `peer_paths_snapshot` flag), `relay_health`/`epoch_acks` got an IMPLICIT
// one (a controller-side `!is_empty()` guard), and `local_endpoints` /
// `applied_version` got NEITHER. So this is not "one call site keeps
// forgetting fields" — the call site is a symptom. The message shape makes
// destruction-by-omission the default.
//
// Two directions for whoever takes this on, neither in scope for the
// session-generation item: split the RPC (`Report` snapshot vs. a separate
// sparse ack/event RPC), or give every replace-semantics field explicit
// presence (proto3 `optional`, absent == "leave alone") so a sparse sender
// physically cannot clear what it did not mean to touch. Until then, EVERY
// new `ReportRequest` construction site must justify all fields, not just
// the ones it cares about.
message ReportRequest {
  uint64 applied_version = 1;
  repeated string local_endpoints = 2;  // gateway's own routable local ip:wg_port
                                         // addresses, offered to the controller as
                                         // local-source candidates for LAN/hairpin
                                         // reachability. Additive field; empty = old
                                         // (pre-4b) client behavior.
  repeated RelayHealth relay_health = 3; // additive; gateway per-relay health
                                          // reports (4c).
  repeated EpochAck epoch_acks = 4;      // gateway->controller liveness acks
                                          // for peers' pending epochs during
                                          // rotation (key-rotation Task 1).
  repeated PeerPath peer_paths = 5;       // additive (directive-storm fix); the
                                          // gateway's current per-peer path state
                                          // (every tracked peer, each Report call)
                                          // so the broker can skip re-punching a
                                          // pair BOTH sides report settled
                                          // ("direct"/"relayed"). Empty = old
                                          // client = pre-fix broker behavior.
  bool peer_paths_snapshot = 6;           // additive; true = `peer_paths` is the
                                          // reporter's COMPLETE current path map
                                          // (a snapshot — REPLACES its stored
                                          // states; empty snapshot clears them).
                                          // New clients set true on EVERY
                                          // steady-state report, INCLUDING empty
                                          // ones. false = legacy upsert-only
                                          // shape (old clients + the gateway's
                                          // rotation-tick unary epoch-ack report,
                                          // which is not a path snapshot and must
                                          // never wipe stored states).
  // (Sync session generation) The reporting gateway's per-PROCESS nonce —
  // the same value it sent on `WatchRequest.session_generation`, from the
  // same `OnceLock`, so the rotation tick's unary Report (which dials its
  // own short-lived channel) matches too. The controller rejects the WHOLE
  // report when this conflicts with the generation recorded at the
  // gateway's last Watch open: a report from before a gateway restart must
  // not be allowed to restore stale `peer_paths`/`local_endpoints`/
  // `relay_health` over the fresh state the reconnect just cleared.
  //
  // 0 = legacy/unknown (an old client, or a report racing a controller
  // restart that emptied the in-memory generation store). A 0 on EITHER
  // side is accepted — see the exact predicate in `services::sync`.
  uint64 session_generation = 7;
}
message EpochAck { uint64 peer_gateway_id = 1; uint32 epoch = 2; bool live = 3; }
// One entry of `ReportRequest.peer_paths`: `state` is the reporting gateway's
// lowercase path-state string for `peer_gateway_id` — exactly
// `PathState::as_str()` ("connecting"|"direct"|"degraded"|"relayed"|
// "disconnected"), the same label the gateway's metrics use.
message PeerPath { uint64 peer_gateway_id = 1; string state = 2; }
message ReportResponse {}

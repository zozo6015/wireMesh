syntax = "proto3";
package wiremesh.v1;
service Admin {
  rpc CreateSegment(CreateSegmentRequest) returns (Segment);
  rpc MintToken(MintTokenRequest) returns (MintTokenResponse);
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
  // (Task 11) Starts a make-before-break key-epoch rotation for a gateway:
  // inserts a new `pending` GATEWAY_KEY(epoch = n+1) row and pushes a Delta
  // to already-connected peers carrying it.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  // (Task 11) Debug/test accessor: every GATEWAY_KEY row (any state) for a
  // gateway, straight off the DB — not part of the gateway-facing
  // projection.
  rpc DebugKeyStates(DebugKeyStatesRequest) returns (DebugKeyStatesResponse);
}
message CreateSegmentRequest { string name = 1; repeated string cidrs = 2; }
message Segment { uint64 id = 1; string name = 2; repeated string cidrs = 3; }
message MintTokenRequest { string kind = 1; repeated string bound_cidrs = 2; uint64 rebind_segment_id = 3; }
message MintTokenResponse { string token = 1; }   // wiremesh://host/#tok...@sha256:...
message ListGatewaysRequest {}
message ListGatewaysResponse { repeated GatewayInfo gateways = 1; }
message GatewayInfo { uint64 id = 1; string name = 2; string segment = 3; string status = 4; uint64 applied_version = 5; }
message RotateKeyRequest { uint64 gateway_id = 1; }
message RotateKeyResponse { uint32 epoch = 1; string pubkey = 2; string state = 3; } // state is always "pending"
message DebugKeyStatesRequest { uint64 gateway_id = 1; }
message GatewayKeyState { uint32 epoch = 1; string state = 2; } // pending|active|retiring
message DebugKeyStatesResponse { repeated GatewayKeyState keys = 1; }

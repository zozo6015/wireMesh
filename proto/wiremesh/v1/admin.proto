syntax = "proto3";
package wiremesh.v1;
service Admin {
  rpc CreateSegment(CreateSegmentRequest) returns (Segment);
  // (Task 13) Every registered segment, its id, name, and CIDRs.
  rpc ListSegments(ListSegmentsRequest) returns (ListSegmentsResponse);
  // (Task 13) Deletes a segment. Fails (FailedPrecondition) if any gateway
  // row (any status) still references it — drain/replace those first.
  rpc DeleteSegment(DeleteSegmentRequest) returns (DeleteSegmentResponse);
  rpc MintToken(MintTokenRequest) returns (MintTokenResponse);
  rpc ListGateways(ListGatewaysRequest) returns (ListGatewaysResponse);
  // (Task 13) Registers a relay (name + reachable endpoint).
  rpc RegisterRelay(RegisterRelayRequest) returns (Relay);
  // (Task 13) Every registered relay.
  rpc ListRelays(ListRelaysRequest) returns (ListRelaysResponse);
  // (Task 13) Mints a bearer API token (distinct from an enrollment
  // token: this authenticates an admin/operator caller of the Admin
  // service over its TCP listener, not a gateway/relay enrolling).
  // `role` must be "admin" or "read-only" — see admin_auth.rs.
  rpc MintApiToken(MintApiTokenRequest) returns (MintApiTokenResponse);
  // (Task 13) Revokes a previously minted API token by name.
  rpc RevokeApiToken(RevokeApiTokenRequest) returns (RevokeApiTokenResponse);
  // (Task 13) Most-recent-first audit log entries, up to `limit` (a
  // non-positive/zero limit falls back to a small default — see
  // AdminSvc::audit_query).
  rpc AuditQuery(AuditQueryRequest) returns (AuditQueryResponse);
  // (Task 11) Starts a make-before-break key-epoch rotation for a gateway:
  // inserts a new `pending` GATEWAY_KEY(epoch = n+1) row and pushes a Delta
  // to already-connected peers carrying it.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  // (Task 11) Debug/test accessor: every GATEWAY_KEY row (any state) for a
  // gateway, straight off the DB — not part of the gateway-facing
  // projection.
  rpc DebugKeyStates(DebugKeyStatesRequest) returns (DebugKeyStatesResponse);
  // (Task 12, G-7) Drains a gateway: withdraws it from every OTHER
  // already-connected gateway's peer set (a Delta with removed_peer_ids),
  // then removes its gateway row and revokes its cert(s).
  rpc Drain(DrainRequest) returns (DrainResponse);
  // (Task 14) Declarative `fabricctl apply -f fabric.yaml`: parses a
  // `segments:`/`relays:`/`policy:` YAML document, diffs it against current
  // controller state, and applies every actual change in one transaction.
  // An identical re-apply must be a true no-op: empty diff, zero mutations,
  // zero new audit rows — see `crate::apply`/`crate::db::Db::apply_fabric`.
  rpc Apply(ApplyRequest) returns (ApplyDiff);
}
message CreateSegmentRequest { string name = 1; repeated string cidrs = 2; }
message Segment { uint64 id = 1; string name = 2; repeated string cidrs = 3; }
message MintTokenRequest { string kind = 1; repeated string bound_cidrs = 2; uint64 rebind_segment_id = 3; }
message MintTokenResponse { string token = 1; }   // wiremesh://host/#tok...@sha256:...
message ListGatewaysRequest {}
message ListGatewaysResponse { repeated GatewayInfo gateways = 1; }
message GatewayInfo { uint64 id = 1; string name = 2; string segment = 3; string status = 4; uint64 applied_version = 5; }
message RotateKeyRequest { uint64 gateway_id = 1; }
message RotateKeyResponse { uint32 epoch = 1; string pubkey = 2; string state = 3; } // state is always "pending"
message DebugKeyStatesRequest { uint64 gateway_id = 1; }
message GatewayKeyState { uint32 epoch = 1; string state = 2; } // pending|active|retiring
message DebugKeyStatesResponse { repeated GatewayKeyState keys = 1; }
message DrainRequest { uint64 gateway_id = 1; }
message DrainResponse {}

message ListSegmentsRequest {}
message ListSegmentsResponse { repeated Segment segments = 1; }
message DeleteSegmentRequest { uint64 segment_id = 1; }
message DeleteSegmentResponse {}

message RegisterRelayRequest { string name = 1; string endpoint = 2; }
message Relay { uint64 id = 1; string name = 2; string endpoint = 3; string status = 4; }
message ListRelaysRequest {}
message ListRelaysResponse { repeated Relay relays = 1; }

// role: "admin" (full access) or "read-only" (non-mutating RPCs only) — see
// the bearer-auth interceptor on the Admin TCP listener in
// wiremesh_controller::auth.
message MintApiTokenRequest { string name = 1; string role = 2; }
message MintApiTokenResponse { string token = 1; }
message RevokeApiTokenRequest { string name = 1; }
message RevokeApiTokenResponse {}

// (Task 14) The raw text of a `fabric.yaml`: a `segments: [{name, cidrs}]`
// list, plus an optional `relays:` list and `policy:` block (policy is
// STUBBED cycle-2: accepted/stored as source, compiled to an empty IR v0 —
// see `crate::apply::compile_policy`).
message ApplyRequest { string fabric_yaml = 1; }
// (Task 14) What `Apply` actually changed. `total_changes` is the sum of
// every count field plus (policy_updated ? 1 : 0) — a fully idempotent
// re-apply yields every field zero/false, i.e. `total_changes == 0`.
message ApplyDiff {
  uint32 created_segments = 1;
  uint32 updated_segments = 2;
  uint32 deleted_segments = 3;
  bool policy_updated = 4;
  uint32 total_changes = 5;
}

// limit <= 0 falls back to a small server-side default.
message AuditQueryRequest { int32 limit = 1; }
message AuditEntry {
  uint64 id = 1;
  string ts = 2;
  string actor = 3;
  string action = 4;
  string entity = 5;
  string diff_json = 6;
}
message AuditQueryResponse { repeated AuditEntry entries = 1; }

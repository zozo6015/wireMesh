[workspace]
resolver = "2"
members = ["crates/wiremesh-proto", "crates/wiremesh-trust", "crates/wiremesh-controller", "crates/fabricctl", "crates/wiremesh-testkit", "crates/wiremesh-policy", "crates/wiremesh-enforcer", "crates/wiremesh-gateway", "crates/wiremesh-relay", "crates/wiremesh-operator", "crates/wiremesh-enroll"]
# `crates/wiremesh-enforcer-ebpf` (Task 7 Step 3) is its own standalone
# aya-template workspace: it ships its own `[workspace]`, which cargo forbids
# nesting inside this one -- see CLAUDE.md's "Execution rules".
exclude = ["crates/wiremesh-enforcer-ebpf"]

# Minimum supported Rust version, declared once and inherited by the eleven
# members via `rust-version.workspace = true`. Before this it was undeclared
# anywhere, so "which rustc does WireMesh need" had no answer in the repo.
#
# 1.91 is MEASURED, not derived. The obvious derivation -- edition 2024 in the
# sibling `crates/wiremesh-enforcer-ebpf` workspace, plus aya 0.14's own 1.87
# floor -- gives 1.85/1.87 and is WRONG, because it stops at the first
# plausible number instead of taking the maximum over the whole build graph.
# `cargo +1.85 check --workspace --all-targets` fails, binding on
# `cargo-platform` 0.3.3 (reached via `cargo_metadata`, which
# `crates/wiremesh-enforcer/build.rs` uses to locate that sibling workspace),
# which declares rustc 1.91. `cargo +1.91 check --workspace --all-targets -j 1`
# then passes a real compile, clean. Verified once at PR0 by that run, and
# re-verified nightly by the scheduled `cold-build` workflow, which installs
# this exact version and fails closed.
#
# WHAT THE NUMBER CLAIMS, precisely. `cargo +1.91 check` still runs
# `wiremesh-enforcer/build.rs`, which builds the eBPF program on the UNDATED
# nightly. So this means "the userspace crates build on 1.91, given a nightly
# toolchain present for the eBPF build step" -- not "the whole tree builds on
# 1.91". The eBPF half has no MSRV and cannot have one.
#
# HOW IT MOVES. The floor is dependency-derived and `Cargo.lock`-pinned (both
# lockfiles are committed), so it changes only on a deliberate `cargo update`
# or a dependency-bump PR -- Dependabot security bumps included, which need no
# config file to land. The nightly check is DETECTION LATENCY, not a gate: if
# the scheduled MSRV step reds, a dependency raised the floor -- bump
# `rust-version`, do not go hunting for a code change.
[workspace.package]
rust-version = "1.91"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
# `default-features = false` + an explicit feature list (Cycle 4c Task 8):
# rustls 0.23's OWN default features are `["aws_lc_rs", "logging",
# "prefer-post-quantum", "std", "tls12"]` — `prefer-post-quantum` in turn
# hard-requires `aws_lc_rs` — so leaving this at plain `"0.23"` pulls the
# `aws-lc-rs` crypto backend into EVERY consumer of this workspace
# dependency, including `wiremesh-relay` (whose own code explicitly wants
# the `ring` backend, via `rustls::crypto::ring::default_provider()`).
# Cargo unifies features for a single dependency version across an entire
# build, so once `aws-lc-rs` and `ring` are BOTH linked into one process —
# exactly what happens in any `wiremesh-gateway` test binary that pulls in
# `wiremesh-relay` (quinn, `ring`-only) as a normal dependency AND
# `wiremesh-testkit`/`wiremesh-controller` (tonic, also `ring`-based) as a
# dev-dependency — `rustls`'s own default-provider auto-detection becomes
# ambiguous and panics the first time ANY code in that process builds a
# `rustls::ClientConfig`/`ServerConfig` without first calling
# `CryptoProvider::install_default()` explicitly (which nothing on the
# `wiremesh-controller`/tonic side ever does). Pinning to `ring` only —
# dropping `aws_lc_rs`/`prefer-post-quantum` — keeps exactly one crypto
# backend linked workspace-wide, matching what every consumer (tonic's
# `tokio-rustls` and `wiremesh-relay`'s `ensure_crypto_provider`) already
# uses, and removes the ambiguity at its root (a build-graph fix) instead of
# papering over one call site.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
serde_yaml = "0.9"
sha2 = "0.10"
rand = "0.8"

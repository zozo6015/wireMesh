[workspace]
resolver = "2"
members = ["crates/wiremesh-proto", "crates/wiremesh-trust", "crates/wiremesh-controller", "crates/fabricctl", "crates/wiremesh-testkit", "crates/wiremesh-policy", "crates/wiremesh-enforcer"]
# `crates/wiremesh-enforcer-ebpf` (Task 7 Step 3) is its own standalone
# aya-template workspace (ships its own `[workspace]`, must not be nested --
# same reason every `spike/*` crate is standalone, see CLAUDE.md's
# "Execution rules"); inert until Step 3 creates that directory.
exclude = ["crates/wiremesh-enforcer-ebpf", "spike"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
rustls = "0.23"
rcgen = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
serde_yaml = "0.9"
sha2 = "0.10"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="WireMesh disconnected">
  <title>WireMesh — disconnected</title>
  <!-- Disconnected state. Deliberately the SAME silhouette as the connected
       mark so the icon does not appear to jump position in the menu bar:
       identical node placement, hollow nodes, severed edges. State is read
       from fill and continuity, never from colour — a template image has none. -->
  <g fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" opacity="0.55">
    <path d="M12 5 L9.6 9.6"/>
    <path d="M7.9 12.9 L5.5 17.5"/>
    <path d="M12 5 L14.4 9.6"/>
    <path d="M16.1 12.9 L18.5 17.5"/>
    <path d="M5.5 17.5 L9.4 17.5"/>
    <path d="M14.6 17.5 L18.5 17.5"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="2">
    <circle cx="12" cy="5" r="2.4"/>
    <circle cx="5.5" cy="17.5" r="2.4"/>
    <circle cx="18.5" cy="17.5" r="2.4"/>
  </g>
</svg>

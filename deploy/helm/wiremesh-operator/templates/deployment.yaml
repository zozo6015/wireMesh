apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiremesh-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wiremesh-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "wiremesh-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wiremesh-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "wiremesh-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "wiremesh-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_IMAGE
              value: {{ include "wiremesh-operator.image" . | quote }}
            - name: RUST_LOG
              value: {{ .Values.operator.logLevel | quote }}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: healthz
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}

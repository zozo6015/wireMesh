apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wiremeshgateways.wiremesh.io
spec:
  group: wiremesh.io
  names:
    categories: []
    kind: WiremeshGateway
    plural: wiremeshgateways
    shortNames:
    - wmgw
    singular: wiremeshgateway
  scope: Cluster
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WiremeshGatewaySpec via `CustomResource`
        properties:
          spec:
            properties:
              image:
                nullable: true
                type: string
              nodeName:
                nullable: true
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                nullable: true
                type: object
              observeEndpoint:
                description: Override for the gateway's `--observe` target (`host:port`; DNS hostnames are accepted — the gateway re-resolves per tick). Needed when the ClusterIP observe path is SNAT'd by kube-proxy (poisoning the observed public mapping); point this at a source-preserving UDP LB instead. Absent → the controller Service ClusterIP (today's default). The enroll init-container is NEVER affected by this override.
                nullable: true
                type: string
              segmentRef:
                description: The `WiremeshSegment` (by `.metadata.name`) this gateway fronts.
                type: string
              storageClass:
                description: StorageClass for the per-gateway identity PVC (`<name>-data`). Omitted → the cluster default class. Parity with `WiremeshControllerSpec`.
                nullable: true
                type: string
              storageSize:
                description: Size of the per-gateway identity PVC. Omitted → the 128Mi default (the persisted identity is a few KB). Parity with `WiremeshControllerSpec`.
                nullable: true
                type: string
              syncEndpoint:
                description: Override for the gateway's `--controller-sync` target (`host:port`; DNS hostnames accepted — re-resolved per reconnect). For controllers reached through an external LB / DDNS name. Absent → the controller Service ClusterIP. The enroll init-container is NEVER affected by this override.
                nullable: true
                type: string
              tun:
                nullable: true
                type: string
              wgPort:
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
            required:
            - segmentRef
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  description: A status condition (mirrors the k8s meta/v1 Condition shape, minus timestamps).
                  properties:
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              enrolled:
                default: false
                type: boolean
              gatewayId:
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              pathState:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: WiremeshGateway
        type: object
    served: true
    storage: true
    subresources:
      status: {}

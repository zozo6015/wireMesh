---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wiremeshcontrollers.wiremesh.io
spec:
  group: wiremesh.io
  names:
    categories: []
    kind: WiremeshController
    plural: wiremeshcontrollers
    shortNames:
    - wmctrl
    singular: wiremeshcontroller
  scope: Cluster
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WiremeshControllerSpec via `CustomResource`
        properties:
          spec:
            properties:
              adminTcpPort:
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
              image:
                nullable: true
                type: string
              observeUdpPort:
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
              rotationInterval:
                description: '`WIREMESH_ROTATION_INTERVAL` passthrough, verbatim — grammar validation (`off`/`<n>d`/`<n>h`/...) lives on the controller boot path, not here. MUST stay `None`-omits-the-env-var: `.force()` on both apply paths (`controllers::apply`/`apply_deployment`) means naming this key at all makes the operator own it under SSA, and the next reconcile would clobber a human''s hand-set `off` — a live fabric-wide rotation-outage mitigation (see root `CLAUDE.md`, "Key rotation"). Removing this field from a CR re-enables rotation (SSA deletes the entry on unset); document that on any UI built over this field.'
                nullable: true
                type: string
              storageClass:
                nullable: true
                type: string
              storageSize:
                nullable: true
                type: string
              syncTcpPort:
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
            type: object
          status:
            nullable: true
            properties:
              adminEndpoint:
                nullable: true
                type: string
              conditions:
                default: []
                items:
                  description: A status condition (mirrors the k8s meta/v1 Condition shape, minus timestamps).
                  properties:
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedVersion:
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              ready:
                default: false
                type: boolean
            type: object
        required:
        - spec
        title: WiremeshController
        type: object
    served: true
    storage: true
    subresources:
      status: {}

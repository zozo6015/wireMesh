# WireMesh operator — manifests-first install (kustomize).
#
#   kubectl apply -k deploy/operator/
#
# Installs the CRDs, the operator namespace + RBAC, and the operator Deployment.
# The operator then materializes the controller/gateways/relays from the CRs you
# apply (see deploy/operator/examples/).
#
# `kubectl apply -f` (non-kustomize) also works if applied in order: crds/ first,
# then namespace.yaml, rbac.yaml, deployment.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - crds/wiremesh-crds.yaml
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml

# Pin the operator image here. NOTE: `images:` rewrites the container `image:`
# field but NOT the OPERATOR_IMAGE env — add a matching `replacements:` (or edit
# deployment.yaml) so the admin-exec sidecar uses the same pinned image, e.g.:
# images:
#   - name: ghcr.io/zozo6015/wiremesh-operator
#     newTag: v0.1.0

# To install into a different namespace, set it here (this rewrites the namespaced
# objects AND the ServiceAccount subjects in the ClusterRoleBinding):
# namespace: my-wiremesh

# OFF-CLUSTER gateways/relays only: to expose the controller through a Gateway
# API implementation, apply deploy/operator/gateway-api/routes.yaml separately
# (it references YOUR Gateway, so it is intentionally NOT in resources above).
# That standalone manifest is NOT processed by kustomize and does NOT inherit the
# `namespace:` set here — apply it with `kubectl -n <this-namespace> apply -f ...`.
# See deploy/operator/gateway-api/README.md and docs/operator.md.

commonLabels:
  app.kubernetes.io/part-of: wiremesh

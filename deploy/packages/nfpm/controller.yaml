name: wiremesh-controller
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: "WireMesh <noreply@zozoo.io>"
description: |
  WireMesh controller — the single-tenant control plane for a zero-trust L3/L4
  network fabric (enrollment, policy, mTLS Sync). Runs as a system service.
vendor: WireMesh
homepage: https://github.com/zozo6015/wireMesh
license: Apache-2.0
section: net
priority: optional
overrides:
  deb:
    depends:
      - passwd          # groupadd/useradd (postinstall-server.sh)
  rpm:
    depends:
      - shadow-utils    # groupadd/useradd (postinstall-server.sh)
contents:
  - src: dist/linux-${ARCH}/wiremesh-controller
    dst: /usr/bin/wiremesh-controller
  - src: deploy/packages/systemd/wiremesh-controller.service
    dst: /lib/systemd/system/wiremesh-controller.service
  - src: deploy/packages/env/controller.env
    dst: /etc/wiremesh/controller.env
    type: "config|noreplace"
# No /var/lib/... entry here on purpose: the controller's state dir
# (/var/lib/wiremesh-controller) is created and owned by systemd's
# StateDirectory= in the unit, so the package never has to — and must never
# claim, chown, or remove the gateway's /var/lib/wiremesh on a shared host.
scripts:
  # Controller-specific postinstall: shared user/group + /etc/wiremesh only,
  # plus a guarded one-time migration of control-plane state (controller.db,
  # ca.pem, ca.key, secrets/) out of the legacy shared /var/lib/wiremesh into
  # /var/lib/wiremesh-controller — copy, verify, atomic rename, repoint the
  # config, THEN delete the originals, so the data dir is never observable
  # half-populated (an empty one makes the controller mint a new CA). Only the
  # controller's own entries move, and ca.pem is copied rather than moved
  # because a legacy relay identity in the same dir needs it (px migration
  # finding 2026-08-01; "Relay Finding A"). Idempotent and never fails install.
  #
  # NOTE the deb/rpm asymmetry this has to cope with: `config|noreplace` below
  # is honoured on rpm (%config(noreplace)) but is a plain conffile on deb —
  # dpkg silently replaces an unmodified controller.env during unpack, BEFORE
  # postinst runs, so on deb the env already points at the new dir.
  postinstall: deploy/packages/scripts/postinstall-server.sh
  preremove: deploy/packages/scripts/preremove-controller.sh
  postremove: deploy/packages/scripts/postremove.sh

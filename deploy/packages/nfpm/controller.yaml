name: wiremesh-controller
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: "WireMesh <noreply@zozoo.io>"
description: |
  WireMesh controller — the single-tenant control plane for a zero-trust L3/L4
  network fabric (enrollment, policy, mTLS Sync). Runs as a system service.
vendor: WireMesh
homepage: https://github.com/zozo6015/wireMesh
license: Apache-2.0
section: net
priority: optional
overrides:
  deb:
    depends:
      - passwd          # groupadd/useradd (postinstall-server.sh)
      # NOT listing coreutils/findutils: both are Essential on Debian, and
      # Policy 3.5 says not to depend on Essential packages.
  rpm:
    depends:
      - shadow-utils    # groupadd/useradd (postinstall-server.sh)
      - coreutils       # stat (postinstall-server.sh ownership probe)
      - findutils       # xargs (postinstall-server.sh drop-in probe)
contents:
  - src: dist/linux-${ARCH}/wiremesh-controller
    dst: /usr/bin/wiremesh-controller
  - src: deploy/packages/systemd/wiremesh-controller.service
    dst: /lib/systemd/system/wiremesh-controller.service
  - src: deploy/packages/env/controller.env
    dst: /etc/wiremesh/controller.env
    type: "config|noreplace"
# No /var/lib/... entry here on purpose: the controller's state dir
# (/var/lib/wiremesh-controller) is created and owned by systemd's
# StateDirectory= in the unit, so the package never has to — and must never
# claim, chown, or remove the gateway's /var/lib/wiremesh on a shared host.
scripts:
  # Controller-specific postinstall: shared user/group + /etc/wiremesh, and one
  # decision — which data dir this host uses. Fresh installs get the new
  # /var/lib/wiremesh-controller default; a host that already has control-plane
  # state in the legacy shared /var/lib/wiremesh gets WIREMESH_DATA_DIR PINNED
  # back to it. It never moves, copies or deletes state (see the script header
  # for why an automatic migration was designed, reviewed, and then dropped).
  #
  # The pin exists because BOTH formats replace an UNMODIFIED controller.env on
  # upgrade, before the scripts run: deb has no conffile "noreplace" mechanism
  # (nfpm maps `config` and `config|noreplace` to the same plain conffile), and
  # rpm's %config(noreplace) only protects a file the user actually changed.
  # Without the pin, an upgraded host would come up pointing at an empty new
  # data dir. Note the pin makes the file "locally modified" for both package
  # managers thereafter — dpkg will prompt on future changes to it, rpm will
  # write .rpmnew and stop delivering them silently (documented in
  # controller.env and docs/install.md).
  postinstall: deploy/packages/scripts/postinstall-server.sh
  preremove: deploy/packages/scripts/preremove-controller.sh
  postremove: deploy/packages/scripts/postremove.sh
